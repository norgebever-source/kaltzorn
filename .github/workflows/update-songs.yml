name: Songs aktualisieren (neueste Spotify-Veröffentlichung zuerst)
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Songliste aktualisieren
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python scripts/update_songs.py
      - name: Änderungen veröffentlichen
        run: |
          if [ -n "$(git status --porcelain index.html img/spotify)" ]; then
            git config user.name "kaltzorn-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html img/spotify
            git commit -m "Songliste automatisch aktualisiert"
            git push
          else
            echo "Keine Änderungen"
          fi
